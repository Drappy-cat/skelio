buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// Shorten CMake/Ninja staging path on Windows to avoid MAX_PATH (260 chars) & Ninja dirty-manifest loops
subprojects { sub ->
    def configureCxxPath = {
        if (file("${sub.projectDir}/CMakeLists.txt").exists() || file("${sub.projectDir}/src/main/jni/CMakeLists.txt").exists()) {
            sub.android {
                externalNativeBuild {
                    cmake {
                        buildStagingDirectory = file("${System.getProperty('user.home')}/.skelio_cxx/${sub.name}")
                    }
                }
            }
        }
    }
    sub.plugins.withId("com.android.library") { configureCxxPath() }
    sub.plugins.withId("com.android.application") { configureCxxPath() }
}
